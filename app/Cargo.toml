[package]
name = "stelly-mix-app"
version = "0.5.0"
edition = "2021"
description = "stelly-mix in a window: the library, a track's beats and phrases, where to go next, and sets"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nab-os/stelly-mix"

[[bin]]
name = "stelly-mix-app"
path = "src/main.rs"

[dependencies]
stelly-mix = { path = ".." }

anyhow = "1"
# A window on Dioxus 0.7, as Stelly's app has.
dioxus = { version = "0.7", features = ["desktop"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Dioxus runs on tokio: the analysis, the renders and the text tower go to
# its blocking pool, and their progress comes back over its channels.
tokio = { version = "1", features = ["rt", "sync"] }
