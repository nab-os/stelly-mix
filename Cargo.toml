[package]
name = "stelly-mix"
version = "0.7.0"
edition = "2021"
description = "Beat grids, phrases and transitions for people who mix"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nab-os/stelly-mix"

[[bin]]
name = "stelly-mix"
path = "src/main.rs"

# The library and its command line here, the window over them in app/.
[workspace]
members = [".", "app"]

[dependencies]
# Decoding (Opus and stereo included), the descriptors, CLAP's two towers and
# fetching their weights, shared with Stelly; every codec on, for local files.
stelly-audio = { git = "https://github.com/nab-os/stelly-audio", tag = "v0.1.0", features = ["all-codecs", "text", "fetch"] }
# The provider protocol's vocabulary, shared with Stelly's server: Quality,
# so the spelling the server parses is never a string literal here. Its
# default features are the types alone, without a client of its own.
stelly-provider = { git = "https://github.com/nab-os/stelly-provider", tag = "v0.2.1" }

anyhow = "1"
argh = "0.1.19"
# Phrase embeddings stored as 16-bit floats in base64: a fifth of their
# size as JSON numbers, which were most of every library entry.
base64 = "0.22"
half = "2"
realfft = "3.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Loudness for matching levels in renders, stereo, as the ear hears it.
ebur128 = "0.1.10"
# The library's file names, from the path.
sha2 = "0.10"
# Stelly's server: its mix library and its tracks' audio.
ureq = "3"
# Keylock for renders: Signalsmith Stretch, compiled from C++, which wants a
# C++ compiler and libclang at build time.
signalsmith-stretch = "0.1.3"
lofty = "0.25"

[profile.release]
lto = true

# The analysis is tight loops over minutes of audio, ~7x slower unoptimised.
[profile.dev]
opt-level = 3

[dev-dependencies]
triseratops = "0.0.3"
