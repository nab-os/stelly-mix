[package]
name = "stelly-mix"
version = "0.1.0"
edition = "2021"
description = "Beat grids, phrases and transitions for people who mix"

[[bin]]
name = "stelly-mix"
path = "src/main.rs"

[dependencies]
# Decoding, the descriptors and CLAP's audio tower, shared with Stelly; every
# codec on, for local files.
stelly-audio = { git = "ssh://git@github.com/nab-os/stelly.git", branch = "shared-audio-crate", features = ["all-codecs"] }

anyhow = "1"
argh = "0.1.19"
# Opus, which symphonia demuxes but cannot decode. Pure Rust, bit-exact on
# the RFC 8251 vectors. opus-decoder is too, but its transforms are plain
# O(n²) DFTs: 28s for a five-minute track where this takes well under one.
rusty-opus = "1.0.1"
realfft = "3.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CLAP's text tower, for finding tracks by description: ONNX Runtime pinned
# to what stelly-audio runs, and the tokenizer Stelly uses.
ort = { version = "=2.0.0-rc.13", features = ["download-binaries"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
# Loudness for matching levels in renders, stereo, as the ear hears it.
ebur128 = "0.1.10"
# Fetching and checking CLAP's weights, once.
sha2 = "0.10"
ureq = "3"
# Stereo decoding for renders, and demuxing Ogg Opus; the same symphonia
# stelly-audio decodes with.
symphonia = { version = "0.6.1", default-features = false, features = ["all-codecs", "all-formats"] }
# Keylock for renders: Signalsmith Stretch, compiled from C++, which wants a
# C++ compiler and libclang at build time.
signalsmith-stretch = "0.1.3"

[profile.release]
lto = true

# The analysis is tight loops over minutes of audio, ~7x slower unoptimised.
[profile.dev]
opt-level = 3
